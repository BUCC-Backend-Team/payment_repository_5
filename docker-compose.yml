services:
  postgres:
    image: postgres:16
    container_name: Marketly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: Marketly
      POSTGRES_USER: Admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: